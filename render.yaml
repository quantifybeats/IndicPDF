services:
  # FastAPI API Service
  - type: web
    name: indicpdf-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /
    envVars:
      - fromGroup: indicpdf-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: indicpdf-redis
          property: connectionString

  # RQ Background Worker
  - type: worker
    name: indicpdf-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/worker.py
    envVars:
      - fromGroup: indicpdf-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: indicpdf-redis
          property: connectionString

  # Key Value (Redis-compatible)
  - type: keyvalue
    name: indicpdf-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

envVarGroups:
  - name: indicpdf-shared
    envVars:
      - key: INDICPDF_API_KEY
        generateValue: true
