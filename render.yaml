services:
  # Monolithic FastAPI + Worker Service (Free Tier)
  - type: web
    name: indicpdf-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /
    envVars:
      - fromGroup: indicpdf-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: indicpdf-redis
          property: connectionString

  # Key Value (Free Redis-compatible)
  - type: keyvalue
    name: indicpdf-redis
    plan: free
    ipAllowList: []

envVarGroups:
  - name: indicpdf-shared
    envVars:
      - key: INDICPDF_API_KEY
        generateValue: true
